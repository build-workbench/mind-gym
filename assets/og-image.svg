<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="100" fill="white" opacity="0.05"/>
  <circle cx="1000" cy="480" r="150" fill="white" opacity="0.05"/>
  <circle cx="600" cy="315" r="200" fill="white" opacity="0.03"/>
  
  <!-- Main content -->
  <g filter="url(#shadow)">
    <text x="600" y="230" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">Mind Gym</text>
    <text x="600" y="310" font-family="Arial, sans-serif" font-size="40" fill="white" text-anchor="middle" opacity="0.95">Memory Training Game</text>
    
    <!-- Feature icons -->
    <text x="600" y="390" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.9">
      🧠 Classic Matching  •  🎯 N-back Training  •  📅 Daily Challenges
    </text>
    
    <text x="600" y="440" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.9">
      📈 Adaptive Difficulty  •  🏆 Progress Tracking
    </text>
    
    <!-- URL -->
    <rect x="350" y="480" width="500" height="50" rx="25" fill="white" opacity="0.2"/>
    <text x="600" y="515" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle">lessup.github.io/mind-gym</text>
  </g>
</svg>
