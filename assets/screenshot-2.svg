  <!-- Mock content area -->
  <rect x="40" y="80" width="1200" 
        height="400" rx="8" fill="white" opacity="0.9"/>
  
  <!-- Mock cards/grid -->
  <g fill="#4f46e5" opacity="0.6">
    <rect x="456" y="120" width="80" height="80" rx="8"/>
<rect x="552" y="120" width="80" height="80" rx="8"/>
<rect x="648" y="120" width="80" height="80" rx="8"/>
<rect x="744" y="120" width="80" height="80" rx="8"/>
<rect x="456" y="216" width="80" height="80" rx="8"/>
<rect x="552" y="216" width="80" height="80" rx="8"/>
<rect x="648" y="216" width="80" height="80" rx="8"/>
<rect x="744" y="216" width="80" height="80" rx="8"/>
<rect x="456" y="312" width="80" height="80" rx="8"/>
<rect x="552" y="312" width="80" height="80" rx="8"/>
<rect x="648" y="312" width="80" height="80" rx="8"/>
<rect x="744" y="312" width="80" height="80" rx="8"/>
  </g>
  
  <!-- Screenshot label -->
  <rect x="10" y="680" width="200" height="30" rx="4" fill="#1e293b" opacity="0.8"/>
  <text x="110" y="700" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Mind Gym - N-back Training</text>
