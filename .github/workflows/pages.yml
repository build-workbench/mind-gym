name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      # Core application files
      - 'index.html'
      - '404.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      # Source modules
      - 'src/**'
      # Assets and styles
      - 'assets/**'
      - 'styles/**'
      - 'tailwind.config.js'
      # Build configuration
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      # Workflow files
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'github-pages'
        type: choice
        options:
          - github-pages

# Prevent concurrent deployments
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  # Build job - lint and test are handled by ci.yml
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build CSS
        run: npm run build:css

      - name: Generate PWA icons
        run: |
          echo "📦 Generating PWA icons..."
          bash scripts/generate-icons.sh
          echo ""
          echo "Generated icon files:"
          ls -la assets/icon-*.png assets/apple-touch-icon.png 2>/dev/null || echo "Warning: Some icons may be missing"

      - name: Prepare deployment bundle
        run: |
          echo "📦 Building deployment bundle..."
          npm run prepare:deploy

      - name: Verify dist contents
        run: |
          echo "📦 Verifying dist directory..."
          ls -la dist/
          echo ""
          echo "📋 Checking required files..."

          # Core files
          required_files=(
            "index.html"
            "404.html"
            "app.js"
            "sw.js"
            "manifest.webmanifest"
            "offline.html"
          )

          for file in "${required_files[@]}"; do
            if [ -f "dist/$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

          # Directories
          echo ""
          echo "📁 Checking directories..."
          for dir in src assets; do
            if [ -d "dist/$dir" ]; then
              file_count=$(find "dist/$dir" -type f | wc -l)
              echo "✅ $dir/ directory exists ($file_count files)"
            else
              echo "❌ $dir/ directory missing"
              exit 1
            fi
          done

          # PWA Icons
          echo ""
          echo "🎨 Checking PWA icons..."
          icon_sizes=(72 96 128 144 152 192 384 512)
          for size in "${icon_sizes[@]}"; do
            if [ -f "dist/assets/icon-${size}.png" ]; then
              echo "✅ icon-${size}.png"
            else
              echo "⚠️  icon-${size}.png missing (will use fallback)"
            fi
          done

          # Apple touch icon
          if [ -f "dist/assets/apple-touch-icon.png" ]; then
            echo "✅ apple-touch-icon.png"
          else
            echo "⚠️  apple-touch-icon.png missing"
          fi

          # OG Image
          if [ -f "dist/assets/og-image.png" ]; then
            echo "✅ og-image.png"
          else
            echo "⚠️  og-image.png missing"
          fi

          echo ""
          echo "📊 Total dist size:"
          du -sh dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  # Deployment job
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📱 PWA is now available!"
          echo "   Users can install the app on:"
          echo "   - Chrome/Edge: Click install icon or Menu → Install"
          echo "   - iOS Safari: Share → Add to Home Screen"
          echo "   - Android Chrome: Menu → Add to Home screen"
