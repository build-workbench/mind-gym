name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      # Core application files
      - 'index.html'
      - '404.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      # Source modules
      - 'src/**'
      # Assets and styles
      - 'assets/**'
      - 'styles/**'
      - 'tailwind.config.js'
      # Build configuration
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      # Workflow files
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'github-pages'
        type: choice
        options:
          - github-pages

# Prevent concurrent deployments
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '24'

jobs:
  # Build job - lint and test are handled by ci.yml
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          echo "✓ librsvg2-bin (rsvg-convert) installed"
          echo "✓ imagemagick (convert) installed"

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build CSS
        run: npm run build:css

      - name: Prepare deployment bundle
        run: |
          echo "📦 Building deployment bundle..."
          npm run prepare:deploy

      - name: Verify dist contents
        run: |
          echo "📦 Verifying dist directory..."

          # Core files
          required_files="index.html app.js sw.js manifest.webmanifest offline.html"
          for file in $required_files; do
            [ -f "dist/$file" ] && echo "✅ $file" || { echo "❌ $file missing"; exit 1; }
          done

          # Directories
          [ -d "dist/src" ] && [ -d "dist/assets" ] || { echo "❌ Required directories missing"; exit 1; }
          echo "✅ src/ and assets/ directories"

          # PWA Icons (only check critical sizes)
          for size in 192 512; do
            [ -f "dist/assets/icon-${size}.png" ] && echo "✅ icon-${size}.png" || echo "⚠️ icon-${size}.png missing"
          done

          echo "📊 Total dist size: $(du -sh dist/ | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  # Deployment job
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📱 PWA is now available!"
          echo "   Users can install the app on:"
          echo "   - Chrome/Edge: Click install icon or Menu → Install"
          echo "   - iOS Safari: Share → Add to Home Screen"
          echo "   - Android Chrome: Menu → Add to Home screen"
