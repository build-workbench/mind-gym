name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      # Core application files
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      # Source modules
      - 'src/**'
      # Assets and styles
      - 'assets/**'
      - 'styles/**'
      - 'tailwind.config.js'
      # Build configuration
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-deploy.sh'
      # Workflow files
      - '.github/workflows/pages.yml'
      - '.github/workflows/ci.yml'
      # Documentation affects site content
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'github-pages'
        type: choice
        options:
          - github-pages

# Prevent concurrent deployments
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Run lint check
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand --coverage

      - name: Build CSS
        run: npm run build:css

      - name: Prepare deployment bundle
        run: npm run prepare:deploy

      - name: Verify dist contents
        run: |
          echo "📦 Verifying dist directory..."
          ls -la dist/
          echo ""
          echo "📋 Checking required files..."
          for file in index.html app.js sw.js manifest.webmanifest; do
            if [ -f "dist/$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done
          echo ""
          echo "📁 Checking src directory..."
          if [ -d "dist/src" ]; then
            echo "✅ src/ directory exists ($(ls dist/src/*.js | wc -l) files)"
          else
            echo "❌ src/ directory missing"
            exit 1
          fi
          echo ""
          echo "📁 Checking assets directory..."
          if [ -d "dist/assets" ]; then
            echo "✅ assets/ directory exists"
          else
            echo "❌ assets/ directory missing"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  # Deployment job
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.deployment.outputs.page_url }}"
