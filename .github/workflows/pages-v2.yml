name: 🚀 Deploy to GitHub Pages (Optimized)

on:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'src/**'
      - 'assets/**'
      - 'styles/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages*.yml'
      - 'scripts/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: pages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # Build and Test Job
  # ===========================================================================
  build:
    name: 📦 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle-size: ${{ steps.size.outputs.size }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📥 Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔍 Run lint
        run: npm run lint

      - name: 🧪 Run tests
        run: npx jest --runInBand --coverage

      - name: 🎨 Build CSS
        run: npm run build:css

      - name: 📦 Prepare deployment
        id: deploy
        run: npm run prepare:deploy

      - name: 📊 Analyze bundle size
        id: size
        run: |
          echo "📦 Bundle analysis:"
          echo ""

          # Calculate total size
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          TOTAL_HUMAN=$(du -sh dist/ | cut -f1)
          echo "Total size: $TOTAL_HUMAN ($TOTAL_SIZE bytes)"
          echo "size=$TOTAL_HUMAN" >> $GITHUB_OUTPUT

          # JS files
          JS_SIZE=$(du -sh dist/*.js dist/src/*.js 2>/dev/null | awk '{sum += $1} END {print sum}')
          echo "JavaScript: ${JS_SIZE}MB"

          # CSS
          CSS_SIZE=$(du -sh dist/assets/*.css 2>/dev/null | cut -f1)
          echo "CSS: $CSS_SIZE"

          # All files
          echo ""
          echo "📄 File breakdown:"
          find dist/ -type f -exec du -h {} \; | sort -rh | head -20

          # Warn if too large
          if [ "$TOTAL_SIZE" -gt 5242880 ]; then
            echo "::warning::Bundle size exceeds 5MB threshold"
          fi

      - name: 🔧 Create .nojekyll
        run: touch dist/.nojekyll

      - name: 📝 Add security headers
        run: |
          cat > dist/_headers << 'EOF'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          EOF

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: ⬆️ Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  # ===========================================================================
  # Deployment Job
  # ===========================================================================
  deploy:
    name: 🚀 Deploy
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Output deployment URL
        run: 'echo "🎉 Deployed to: ${{ steps.deployment.outputs.page_url }}"'
