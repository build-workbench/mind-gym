name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      # 生产构建：terser 压缩 JS + Tailwind CSS + 图标生成（失败不阻断）
      - run: npm ci --prefer-offline
      - run: bash scripts/prepare-deploy.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ci-passed:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Await CI workflow result on the same ref
        run: |
          for i in $(seq 1 60); do
            conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name == "CI Passed") | .conclusion] | first // empty')
            if [ "$conclusion" = "success" ]; then echo "CI passed"; exit 0; fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "CI failed"; exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for CI"; exit 1
        env:
          GH_TOKEN: ${{ github.token }}
