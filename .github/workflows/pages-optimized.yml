name: 🚀 Deploy to GitHub Pages (Ultra Optimized)

on:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'src/**'
      - 'assets/**'
      - 'styles/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages*.yml'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'github-pages'
        type: choice
        options:
          - github-pages
          - preview

# Prevent concurrent deployments
concurrency:
  group: pages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # Build and Test Job
  # ============================================================================
  build:
    name: 📦 Build & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview-url: ${{ steps.preview.outputs.url }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Analyze repository size
        run: |
          echo "📁 Repository structure:"
          du -sh .
          echo ""
          echo "📊 File counts:"
          find . -type f -not -path './.git/*' | wc -l
          echo ""
          echo "📝 JavaScript files:"
          find . -name '*.js' -not -path './.git/*' | wc -l

      - name: ⚙️ Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-mod-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-mod-

      - name: 📥 Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          echo "✅ Dependencies installed"

      - name: 🔍 Run lint
        run: |
          echo "🧹 Running linter..."
          npm run lint
          echo "✅ Lint passed"

      - name: 🧪 Run tests
        run: |
          echo "🧪 Running tests..."
          npm test -- --runInBand --coverage --verbose
          echo "✅ Tests passed"

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: 🎨 Build CSS with optimization
        run: |
          echo "🎨 Building optimized CSS..."
          npm run build:css
          echo "✅ CSS built"
          ls -lh assets/app.css

      - name: 📦 Prepare deployment bundle
        run: |
          echo "📦 Preparing deployment bundle..."
          npm run prepare:deploy
          echo "✅ Bundle prepared"

      - name: 🔧 Optimize build
        run: |
          echo "🔧 Running additional optimizations..."

          # Create .nojekyll to disable Jekyll processing
          touch dist/.nojekyll

          # Add security headers configuration
          cat > dist/_headers << 'EOF'
          /*
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';
            Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
            X-XSS-Protection: 1; mode=block

          /assets/*
            Cache-Control: public, max-age=31536000, immutable

          /src/*.js
            Cache-Control: public, max-age=86400

          /sw.js
            Cache-Control: public, max-age=0, must-revalidate

          /index.html
            Cache-Control: public, max-age=0, must-revalidate
          EOF

          echo "✅ Security headers configured"

          # Create _redirects for SPAs
          cat > dist/_redirects << 'EOF'
          # Redirect rules for single page application
          /* /index.html 200
          EOF

          echo "✅ Redirects configured"

      - name: 🔍 Verify dist contents
        run: |
          echo "🔍 Verifying dist directory contents..."
          echo ""
          du -sh dist/
          echo ""
          ls -lah dist/
          echo ""
          echo "📋 Checking required files..."
          required_files=("index.html" "app.js" "sw.js" "manifest.webmanifest")
          for file in "${required_files[@]}"; do
            if [ -f "dist/$file" ]; then
              size=$(du -h "dist/$file" | cut -f1)
              echo "✅ $file ($size)"
            else
              echo "❌ $file MISSING!"
              exit 1
            fi
          done
          echo ""
          echo "📁 Checking directories..."
          if [ -d "dist/src" ]; then
            count=$(ls dist/src/*.js 2>/dev/null | wc -l)
            echo "✅ src/ directory ($count JS files)"
          else
            echo "❌ src/ directory MISSING!"
            exit 1
          fi
          if [ -d "dist/assets" ]; then
            echo "✅ assets/ directory"
          else
            echo "❌ assets/ directory MISSING!"
            exit 1
          fi
          echo ""
          echo "🎉 All verifications passed!"

      - name: 📊 Generate bundle report
        run: |
          echo "📊 Bundle size analysis:"
          echo ""
          echo "=== JavaScript Files ==="
          find dist -name '*.js' -exec du -h {} \; | sort -rh | head -20
          echo ""
          echo "=== CSS Files ==="
          find dist -name '*.css' -exec du -h {} \; | sort -rh
          echo ""
          echo "=== Total ==="
          du -sh dist/

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  # ============================================================================
  # Lighthouse Performance Audit
  # ============================================================================
  lighthouse:
    name: 🔦 Lighthouse Audit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install Lighthouse CI
        run: npm install -g @lhci/cli@latest

      - name: 🚀 Serve and audit
        run: |
          # Serve the dist folder
          npx serve dist -l 3000 &
          SERVER_PID=$!

          # Wait for server
          sleep 3

          # Run Lighthouse CI
          lhci autorun --config=lighthouserc.js || true

          # Kill server
          kill $SERVER_PID || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: 📊 Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: ./lhci-reports/
          retention-days: 30

  # ============================================================================
  # Deploy to Production
  # ============================================================================
  deploy:
    name: 🚀 Deploy Production
    needs: [build, lighthouse]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Output deployment info
        run: |
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo ""
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔨 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo ""
          echo "✅ Site is live!"

  # ============================================================================
  # Deploy PR Preview
  # ============================================================================
  preview:
    name: 👀 Deploy Preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: 🚀 Deploy to Surge.sh (Preview)
        id: preview
        run: |
          BRANCH="${{ github.head_ref }}"
          REPO="${{ github.repository }}"
          # Create a URL-friendly subdomain
          SUBDOMAIN=$(echo "${REPO}-${BRANCH}" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-')
          PREVIEW_URL="https://${SUBDOMAIN}.surge.sh"

          echo "Deploying to: $PREVIEW_URL"

          # Install surge globally
          npm install -g surge

          # Deploy
          surge dist "$PREVIEW_URL" --token "${{ secrets.SURGE_TOKEN }}" || {
            echo "Surge deployment failed - may need manual configuration"
            PREVIEW_URL=""
          }

          echo "url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_ENV
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        continue-on-error: true

      - name: 💬 Comment PR with preview URL
        uses: actions/github-script@v7
        if: steps.preview.outputs.url != ''
        with:
          script: |
            const previewUrl = '${{ steps.preview.outputs.url }}';
            const body = `## 🚀 PR Preview Deployed

            | Item | Value |
            |------|-------|
            | 🔗 Preview URL | [${previewUrl}](${previewUrl}) |
            | 📅 Deployed | ${new Date().toISOString()} |
            | 🔨 Commit | ${{ github.event.pull_request.head.sha }} |

            ⚠️ **Note:** This preview environment is temporary and will be removed when the PR is closed.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
