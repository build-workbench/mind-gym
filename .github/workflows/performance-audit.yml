name: 🔦 Performance Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lighthouse:
    name: 🚦 Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: |
          npm ci --prefer-offline
          npm install -g @lhci/cli@latest

      - name: 🎨 Build application
        run: |
          npm run build:css
          npm run prepare:deploy
          
          # Create .nojekyll
          touch dist/.nojekyll

      - name: 🔦 Run Lighthouse CI
        id: lighthouse
        run: |
          # Start server in background
          npx serve dist -l 3000 &
          SERVER_PID=$!
          
          # Wait for server
          sleep 3
          
          # Ensure server is running
          curl -s http://localhost:3000 > /dev/null || {
            echo "Server failed to start"
            exit 1
          }
          
          # Run Lighthouse CI
          lhci autorun --config=lighthouserc.js || true
          
          # Stop server
          kill $SERVER_PID || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: 📊 Process results
        id: results
        run: |
          if [ -d "lhci-reports" ]; then
            echo "Found reports directory"
            ls -la lhci-reports/
            
            # Extract scores if possible
            if [ -f "lhci-reports/manifest.json" ]; then
              echo "manifest.json:"
              cat lhci-reports/manifest.json
            fi
          else
            echo "No reports found"
          fi

      - name: 📤 Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            ./lhci-reports/
            !./lhci-reports/.gitkeep
          retention-days: 30

      - name: 💬 Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Try to find and parse Lighthouse results
            const reportsDir = './lhci-reports';
            let message = '## 🔦 Lighthouse Performance Audit\n\n';
            
            if (fs.existsSync(reportsDir)) {
              const files = fs.readdirSync(reportsDir);
              const jsonFiles = files.filter(f => f.endsWith('.json'));
              
              if (jsonFiles.length > 0) {
                try {
                  const reportPath = path.join(reportsDir, jsonFiles[0]);
                  const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                  
                  const categories = report.categories || {};
                  
                  // Generate table
                  message += '| Category | Score |\n';
                  message += '|----------|-------|\n';
                  
                  for (const [key, value] of Object.entries(categories)) {
                    const name = key.charAt(0).toUpperCase() + key.slice(1);
                    const score = Math.round(value.score * 100);
                    const emoji = score >= 90 ? '🟢' : score >= 70 ? '🟡' : '🔴';
                    message += `| ${emoji} ${name} | **${score}** |\n`;
                  }
                  
                  message += '\n';
                } catch (e) {
                  message += '> ⚠️ Could not parse Lighthouse results\n\n';
                }
              } else {
                message += '> No reports generated\n\n';
              }
            } else {
              message += '> Reports directory not found\n\n';
            }
            
            message += '---\n';
            message += '*Generated by Lighthouse CI*';
            
            // Find or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Lighthouse Performance Audit')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }

  web-vitals:
    name: 📊 Web Vitals Check
    runs-on: ubuntu-latest
    needs: lighthouse
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🌐 Check production site
        run: |
          echo "Checking deployed site performance..."
          
          # Simple curl check with timing
          curl -s -o /dev/null -w "\n
          Connection Time: %{time_connect}s
          TTFB: %{time_starttransfer}s
          Total Time: %{time_total}s
          HTTP Code: %{http_code}
          Size: %{size_download} bytes
          " https://lessup.github.io/mind-gym/ || echo "Production site check failed"

  bundle-analysis:
    name: 📦 Bundle Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci --prefer-offline

      - name: 📊 Analyze bundle
        run: |
          npm run build:css
          npm run prepare:deploy
          
          echo "## 📦 Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### JavaScript Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          
          find dist -name '*.js' -type f | while read file; do
            size=$(du -h "$file" | cut -f1)
            name=$(basename "$file")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CSS Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          
          find dist -name '*.css' -type f | while read file; do
            size=$(du -h "$file" | cut -f1)
            name=$(basename "$file")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Size" >> $GITHUB_STEP_SUMMARY
          total=$(du -sh dist | cut -f1)
          echo "**Total: $total**" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: dist/
          retention-days: 7
