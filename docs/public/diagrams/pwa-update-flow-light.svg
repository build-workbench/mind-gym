<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mind Gym update behavior</title>
  <desc id="desc">Flowchart showing install, activate, and fetch request handling in the service worker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--canvas-top)" />
      <stop offset="100%" stop-color="var(--canvas-bottom)" />
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13Z" fill="var(--line)" />
    </marker>
    <style>
      :root {
        --canvas-top: #f8f7ff;
        --canvas-bottom: #eef3ff;
        --surface: #ffffff;
        --surface-strong: #f3ecff;
        --surface-soft: #eef6ff;
        --border: #d8d7f0;
        --line: #7463ff;
        --text: #18162a;
        --muted: #5f6279;
        --shadow: rgba(67, 49, 151, 0.12);
      }
      text {
        fill: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .caption {
        font-size: 14px;
        fill: var(--muted);
      }
      .node {
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 2;
        filter: drop-shadow(0 16px 28px var(--shadow));
      }
      .node--accent {
        fill: var(--surface-strong);
      }
      .node--soft {
        fill: var(--surface-soft);
      }
      .node-title {
        font-size: 18px;
        font-weight: 700;
      }
      .node-body {
        font-size: 13px;
        fill: var(--muted);
      }
      .decision {
        fill: var(--surface-soft);
        stroke: var(--border);
        stroke-width: 2;
        filter: drop-shadow(0 16px 28px var(--shadow));
      }
      .line {
        fill: none;
        stroke: var(--line);
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .edge-label {
        font-size: 13px;
        font-weight: 700;
        fill: var(--muted);
      }
    </style>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#bg)" />
  <text x="56" y="70" class="title">Service Worker update behavior</text>
  <text x="56" y="98" class="caption">Install and activate prepare the shell; fetch chooses the runtime strategy based on request shape.</text>

  <rect x="120" y="146" width="210" height="92" rx="24" class="node node--accent" />
  <text x="160" y="186" class="node-title">Install event</text>
  <text x="160" y="210" class="node-body">Boot the next shell revision</text>

  <rect x="120" y="300" width="210" height="108" rx="24" class="node" />
  <text x="160" y="340" class="node-title">Precache shell assets</text>
  <text x="160" y="364" class="node-body">HTML, JS, CSS, icons, support pages</text>

  <rect x="120" y="470" width="210" height="92" rx="24" class="node node--soft" />
  <text x="160" y="510" class="node-title">skipWaiting</text>
  <text x="160" y="534" class="node-body">Promote the new worker</text>

  <rect x="462" y="146" width="210" height="92" rx="24" class="node node--accent" />
  <text x="502" y="186" class="node-title">Activate event</text>
  <text x="502" y="210" class="node-body">Take ownership of clients</text>

  <rect x="462" y="300" width="210" height="108" rx="24" class="node" />
  <text x="502" y="340" class="node-title">Cleanup old caches</text>
  <text x="502" y="364" class="node-body">Remove stale Mind Gym cache keys</text>

  <rect x="462" y="470" width="210" height="92" rx="24" class="node node--soft" />
  <text x="502" y="510" class="node-title">clients.claim</text>
  <text x="502" y="534" class="node-body">Control active pages immediately</text>

  <rect x="804" y="146" width="210" height="92" rx="24" class="node node--accent" />
  <text x="844" y="186" class="node-title">Fetch event</text>
  <text x="844" y="210" class="node-body">Inspect every request</text>

  <path d="M909 300L1014 376L909 452L804 376Z" class="decision" />
  <text x="866" y="368" class="node-title">Request type?</text>
  <text x="846" y="392" class="node-body">navigate / JS-CSS / image / other</text>

  <rect x="1040" y="228" width="124" height="78" rx="20" class="node" />
  <text x="1064" y="260" class="node-title">Network first</text>
  <text x="1064" y="282" class="node-body">HTML fallback</text>

  <rect x="1040" y="336" width="124" height="78" rx="20" class="node" />
  <text x="1060" y="368" class="node-title">SWR</text>
  <text x="1058" y="390" class="node-body">JS / CSS</text>

  <rect x="1040" y="444" width="124" height="78" rx="20" class="node" />
  <text x="1054" y="476" class="node-title">Cache first</text>
  <text x="1057" y="498" class="node-body">Images</text>

  <rect x="1040" y="552" width="124" height="78" rx="20" class="node" />
  <text x="1060" y="584" class="node-title">Runtime cache</text>
  <text x="1072" y="606" class="node-body">Other</text>

  <path d="M225 238V300" class="line" />
  <path d="M225 408V470" class="line" />
  <path d="M330 516H462" class="line" />
  <path d="M567 238V300" class="line" />
  <path d="M567 408V470" class="line" />
  <path d="M672 516H804" class="line" />
  <path d="M909 238V300" class="line" />
  <path d="M1014 342L1040 272" class="line" />
  <path d="M1014 376H1040" class="line" />
  <path d="M1014 410L1040 482" class="line" />
  <path d="M909 452V552H1040" class="line" />

  <text x="1014" y="255" class="edge-label">Navigate</text>
  <text x="1022" y="327" class="edge-label">JS / CSS</text>
  <text x="1022" y="474" class="edge-label">Images</text>
  <text x="936" y="544" class="edge-label">Other</text>
</svg>
