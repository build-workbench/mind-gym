<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mind Gym state architecture</title>
  <desc id="desc">Three-layer state architecture with settings, game state, mode state, and supporting deep modules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--canvas-top)" />
      <stop offset="100%" stop-color="var(--canvas-bottom)" />
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13Z" fill="var(--line)" />
    </marker>
    <style>
      :root {
        --canvas-top: #f8f7ff;
        --canvas-bottom: #eef3ff;
        --surface: #ffffff;
        --surface-strong: #f3ecff;
        --surface-soft: #eef6ff;
        --border: #d8d7f0;
        --line: #7463ff;
        --line-soft: #97a4d8;
        --text: #18162a;
        --muted: #5f6279;
        --shadow: rgba(67, 49, 151, 0.12);
      }
      text {
        fill: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .caption {
        font-size: 14px;
        fill: var(--muted);
      }
      .layer {
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 2;
        filter: drop-shadow(0 18px 30px var(--shadow));
      }
      .layer--accent {
        fill: var(--surface-strong);
      }
      .layer--soft {
        fill: var(--surface-soft);
      }
      .layer-kicker {
        font-size: 13px;
        font-weight: 700;
        fill: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .layer-title {
        font-size: 28px;
        font-weight: 700;
      }
      .layer-body {
        font-size: 15px;
        fill: var(--muted);
      }
      .node {
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 2;
      }
      .node-title {
        font-size: 16px;
        font-weight: 700;
      }
      .node-body {
        font-size: 13px;
        fill: var(--muted);
      }
      .line {
        fill: none;
        stroke: var(--line);
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .line-soft {
        fill: none;
        stroke: var(--line-soft);
        stroke-width: 2.5;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#bg)" />
  <text x="56" y="70" class="title">Three-layer state architecture</text>
  <text x="56" y="98" class="caption">State is separated by time horizon and responsibility, then reinforced with deep modules.</text>

  <rect x="120" y="148" width="720" height="134" rx="30" class="layer layer--accent" />
  <text x="160" y="186" class="layer-kicker">Persistent policy</text>
  <text x="160" y="226" class="layer-title">Settings</text>
  <text x="160" y="254" class="layer-body">src/settings-manager.js</text>
  <text x="360" y="226" class="layer-body">Theme, sound, language, volume, countdown presets, card face, adaptive toggles.</text>

  <rect x="120" y="326" width="720" height="164" rx="30" class="layer" />
  <text x="160" y="364" class="layer-kicker">Runtime coordination</text>
  <text x="160" y="404" class="layer-title">GameState</text>
  <text x="160" y="432" class="layer-body">src/game-state.js</text>
  <text x="360" y="404" class="layer-body">Difficulty, session flags, hints, elapsed time, seen cards, win flow.</text>
  <rect x="360" y="442" width="144" height="34" rx="17" class="node" />
  <text x="388" y="464" class="node-body">Delegates pair logic</text>
  <rect x="520" y="442" width="126" height="34" rx="17" class="node" />
  <text x="550" y="464" class="node-body">Owns timers</text>
  <rect x="662" y="442" width="142" height="34" rx="17" class="node" />
  <text x="688" y="464" class="node-body">Triggers win pipeline</text>

  <rect x="120" y="534" width="720" height="132" rx="30" class="layer layer--soft" />
  <text x="160" y="572" class="layer-kicker">On-demand specialization</text>
  <text x="160" y="612" class="layer-title">ModeState</text>
  <text x="160" y="640" class="layer-body">src/nback-state.js and src/recall-state.js</text>
  <text x="430" y="612" class="layer-body">Sequence state, recall candidate generation, mode-only counters, timers, prompts.</text>

  <rect x="896" y="182" width="196" height="96" rx="24" class="node" />
  <text x="930" y="220" class="node-title">storage.js</text>
  <text x="930" y="244" class="node-body">Normalizes localStorage IO</text>
  <rect x="896" y="336" width="196" height="112" rx="24" class="node" />
  <text x="930" y="374" class="node-title">GameManager</text>
  <text x="930" y="398" class="node-body">Match detection</text>
  <text x="930" y="418" class="node-body">Locking and move count</text>
  <rect x="896" y="486" width="196" height="112" rx="24" class="node" />
  <text x="930" y="524" class="node-title">modes.js + src/modes/*</text>
  <text x="930" y="548" class="node-body">Pure mode rules</text>
  <text x="930" y="568" class="node-body">N-back / recall helpers</text>

  <path d="M480 282V326" class="line" />
  <path d="M480 490V534" class="line" />
  <path d="M840 214H896" class="line-soft" />
  <path d="M840 408H896" class="line" />
  <path d="M840 600H896" class="line-soft" />
  <path d="M612 490C612 522 100 522 100 600C100 670 896 670 896 598" class="line-soft" />
</svg>
