<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mind Gym system overview</title>
  <desc id="desc">Static architecture diagram showing the browser shell, game runtime, storage, and offline boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--canvas-top)" />
      <stop offset="100%" stop-color="var(--canvas-bottom)" />
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13Z" fill="var(--line)" />
    </marker>
    <style>
      :root {
          --canvas-top: #161326;
          --canvas-bottom: #0f1728;
          --surface: #1d2032;
          --surface-strong: #2a2145;
          --surface-soft: #1a2739;
          --border: #3a3f5f;
          --line: #a995ff;
          --line-soft: #5f6a98;
          --text: #f3f2ff;
          --muted: #b8bdd5;
          --shadow: rgba(5, 8, 18, 0.34);
      }
      text {
        fill: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .caption {
        font-size: 14px;
        fill: var(--muted);
      }
      .zone {
        fill: none;
        stroke: var(--border);
        stroke-width: 2;
        stroke-dasharray: 8 8;
        rx: 28;
      }
      .zone-label {
        font-size: 15px;
        font-weight: 700;
        fill: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .node {
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 2;
        filter: drop-shadow(0 16px 28px var(--shadow));
      }
      .node--accent {
        fill: var(--surface-strong);
      }
      .node--soft {
        fill: var(--surface-soft);
      }
      .node-title {
        font-size: 18px;
        font-weight: 700;
      }
      .node-body {
        font-size: 13px;
        fill: var(--muted);
      }
      .line {
        fill: none;
        stroke: var(--line);
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .line-soft {
        fill: none;
        stroke: var(--line-soft);
        stroke-width: 2.5;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg)" />
  <text x="56" y="70" class="title">Mind Gym system overview</text>
  <text x="56" y="98" class="caption">Browser-first runtime, docs shell, storage, and offline delivery without a custom backend.</text>

  <rect x="48" y="130" width="260" height="540" class="zone" />
  <text x="72" y="160" class="zone-label">Entry surface</text>
  <rect x="78" y="190" width="200" height="86" rx="24" class="node node--accent" />
  <text x="108" y="228" class="node-title">Player / reader</text>
  <text x="108" y="252" class="node-body">Human entry point</text>
  <rect x="78" y="322" width="200" height="110" rx="24" class="node" />
  <text x="108" y="362" class="node-title">Browser shell</text>
  <text x="108" y="386" class="node-body">Loads static HTML, CSS, JS</text>
  <text x="108" y="406" class="node-body">Routes docs or /play/ demo</text>
  <rect x="78" y="478" width="200" height="150" rx="24" class="node node--soft" />
  <text x="108" y="518" class="node-title">Docs + play split</text>
  <text x="108" y="542" class="node-body">/en and /zh whitepaper</text>
  <text x="108" y="562" class="node-body">/play interactive PWA</text>
  <text x="108" y="582" class="node-body">Root compatibility redirect</text>

  <rect x="356" y="130" width="498" height="540" class="zone" />
  <text x="380" y="160" class="zone-label">Runtime core</text>
  <rect x="392" y="188" width="190" height="94" rx="24" class="node node--accent" />
  <text x="422" y="228" class="node-title">index.html / app.js</text>
  <text x="422" y="252" class="node-body">Composition root + orchestration</text>
  <rect x="628" y="188" width="190" height="94" rx="24" class="node" />
  <text x="658" y="228" class="node-title">UI layer</text>
  <text x="658" y="252" class="node-body">ui.js, renderer, modal manager</text>
  <rect x="392" y="340" width="190" height="118" rx="24" class="node" />
  <text x="422" y="380" class="node-title">GameState</text>
  <text x="422" y="404" class="node-body">Session coordination</text>
  <text x="422" y="424" class="node-body">Difficulty, hints, timers, combo</text>
  <rect x="628" y="340" width="190" height="118" rx="24" class="node" />
  <text x="658" y="380" class="node-title">SettingsManager</text>
  <text x="658" y="404" class="node-body">Persistent policy</text>
  <text x="658" y="424" class="node-body">Theme, sound, language, presets</text>
  <rect x="392" y="516" width="120" height="106" rx="22" class="node node--soft" />
  <text x="418" y="554" class="node-title">GameManager</text>
  <text x="418" y="578" class="node-body">Match logic</text>
  <rect x="536" y="516" width="120" height="106" rx="22" class="node node--soft" />
  <text x="568" y="554" class="node-title">Timer</text>
  <text x="554" y="578" class="node-body">Countdown</text>
  <rect x="680" y="516" width="138" height="106" rx="22" class="node node--soft" />
  <text x="712" y="554" class="node-title">Modes</text>
  <text x="706" y="578" class="node-body">NBack / Recall</text>

  <rect x="902" y="130" width="250" height="540" class="zone" />
  <text x="926" y="160" class="zone-label">Persistence + offline</text>
  <rect x="934" y="190" width="186" height="96" rx="24" class="node node--accent" />
  <text x="964" y="230" class="node-title">storage.js</text>
  <text x="964" y="254" class="node-body">User-owned progress and settings</text>
  <rect x="934" y="336" width="186" height="96" rx="24" class="node" />
  <text x="964" y="376" class="node-title">localStorage</text>
  <text x="964" y="400" class="node-body">Stats, achievements, mastery</text>
  <rect x="934" y="482" width="186" height="128" rx="24" class="node node--soft" />
  <text x="964" y="522" class="node-title">sw.js + Cache Storage</text>
  <text x="964" y="546" class="node-body">Offline shell delivery</text>
  <text x="964" y="566" class="node-body">Network-first HTML</text>
  <text x="964" y="586" class="node-body">Static asset caching</text>

  <path d="M278 233H392" class="line" />
  <path d="M278 377H392" class="line" />
  <path d="M582 235H628" class="line" />
  <path d="M487 282V340" class="line-soft" />
  <path d="M723 282V340" class="line-soft" />
  <path d="M487 458V516" class="line-soft" />
  <path d="M487 458C487 485 596 485 596 516" class="line-soft" />
  <path d="M487 458C487 478 749 478 749 516" class="line-soft" />
  <path d="M818 398H934" class="line" />
  <path d="M1027 286V336" class="line-soft" />
  <path d="M723 458C723 498 1027 444 1027 482" class="line-soft" />
  <path d="M278 552C278 620 1027 620 1027 610" class="line-soft" />
</svg>
