<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mind Gym request and cache flow</title>
  <desc id="desc">Sequence-like diagram for browser requests, service worker, cache storage, network fallback, and localStorage restoration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--canvas-top)" />
      <stop offset="100%" stop-color="var(--canvas-bottom)" />
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13Z" fill="var(--line)" />
    </marker>
    <marker id="arrow-soft" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L13 7L1 13Z" fill="var(--line-soft)" />
    </marker>
    <style>
      :root {
        --canvas-top: #f8f7ff;
        --canvas-bottom: #eef3ff;
        --surface: #ffffff;
        --surface-strong: #f3ecff;
        --border: #d8d7f0;
        --line: #7463ff;
        --line-soft: #97a4d8;
        --text: #18162a;
        --muted: #5f6279;
        --shadow: rgba(67, 49, 151, 0.12);
      }
      text {
        fill: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .caption {
        font-size: 14px;
        fill: var(--muted);
      }
      .lane {
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 2;
        filter: drop-shadow(0 14px 24px var(--shadow));
      }
      .lane-title {
        font-size: 16px;
        font-weight: 700;
      }
      .lane-body {
        font-size: 13px;
        fill: var(--muted);
      }
      .lifeline {
        stroke: var(--border);
        stroke-width: 2;
        stroke-dasharray: 8 8;
      }
      .line {
        fill: none;
        stroke: var(--line);
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .line-soft {
        fill: none;
        stroke: var(--line-soft);
        stroke-width: 2.5;
        marker-end: url(#arrow-soft);
      }
      .step {
        font-size: 13px;
        fill: var(--muted);
      }
    </style>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg)" />
  <text x="56" y="70" class="title">Request and cache flow</text>
  <text x="56" y="98" class="caption">Cache Storage protects shipped assets; localStorage restores player-owned data after the shell is ready.</text>

  <g transform="translate(74 150)">
    <rect width="150" height="86" rx="24" class="lane lane" />
    <text x="34" y="38" class="lane-title">User</text>
    <text x="34" y="60" class="lane-body">Open Mind Gym</text>
    <line x1="75" y1="102" x2="75" y2="470" class="lifeline" />
  </g>
  <g transform="translate(278 150)">
    <rect width="170" height="86" rx="24" class="lane lane" />
    <text x="34" y="38" class="lane-title">Browser</text>
    <text x="34" y="60" class="lane-body">Loads docs shell or /play/</text>
    <line x1="85" y1="102" x2="85" y2="470" class="lifeline" />
  </g>
  <g transform="translate(500 150)">
    <rect width="170" height="86" rx="24" class="lane lane" />
    <text x="34" y="38" class="lane-title">Service Worker</text>
    <text x="34" y="60" class="lane-body">Interprets fetch strategy</text>
    <line x1="85" y1="102" x2="85" y2="470" class="lifeline" />
  </g>
  <g transform="translate(722 150)">
    <rect width="170" height="86" rx="24" class="lane lane" />
    <text x="34" y="38" class="lane-title">Cache Storage</text>
    <text x="34" y="60" class="lane-body">Shell and static assets</text>
    <line x1="85" y1="102" x2="85" y2="470" class="lifeline" />
  </g>
  <g transform="translate(944 150)">
    <rect width="170" height="86" rx="24" class="lane lane" />
    <text x="34" y="38" class="lane-title">Network / localStorage</text>
    <text x="34" y="60" class="lane-body">Fresh fetch + user data</text>
    <line x1="85" y1="102" x2="85" y2="470" class="lifeline" />
  </g>

  <path d="M149 278H363" class="line" />
  <text x="184" y="264" class="step">1. Open app</text>
  <path d="M363 334H585" class="line" />
  <text x="406" y="320" class="step">2. Route requests</text>
  <path d="M585 390H807" class="line" />
  <text x="618" y="376" class="step">3. Check cache</text>
  <path d="M807 438H585" class="line-soft" />
  <text x="646" y="424" class="step">4a. Cached response</text>
  <path d="M807 494H1029" class="line-soft" />
  <text x="838" y="480" class="step">4b. Cache miss -> fetch</text>
  <path d="M1029 550H585" class="line" />
  <text x="734" y="536" class="step">5. Store and return response</text>
  <path d="M585 606H363" class="line" />
  <text x="430" y="592" class="step">6. Render shell</text>
  <path d="M363 662H1029" class="line-soft" />
  <text x="520" y="648" class="step">7. Restore settings, stats, achievements, and mastery from localStorage</text>
</svg>
